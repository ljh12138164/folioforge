name: folioforge

services:
  web:
    image: folioforge:${IMAGE_TAG:?IMAGE_TAG must identify a verified release}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

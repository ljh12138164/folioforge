map $uri $folioforge_cache_control {
    default "public, no-cache, must-revalidate";
    ~^/_next/static/ "public, max-age=31536000, immutable";
    /pdf-sw.js "no-cache, no-store, must-revalidate";
    /healthz "no-store";
    /release.txt "no-store";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Keep headers at one level so location-specific cache rules do not erase them.
    add_header Cache-Control $folioforge_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /pdf-sw.js {
        default_type application/javascript;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        types { application/xml xml; }
        try_files $uri =404;
    }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location /_next/static/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
